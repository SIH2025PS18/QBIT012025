# Deploy Telemed Flutter Web App to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Set permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'
        cache: true
        
    - name: Enable web platform
      run: flutter config --enable-web
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Analyze code
      run: flutter analyze || true  # Continue even if analysis finds issues
      
    - name: Create web build directory
      run: mkdir -p build/web
      
    - name: Build Flutter web app with web-compatible dependencies
      run: |
        # Backup original pubspec.yaml
        cp pubspec.yaml pubspec_backup.yaml
        
        # Create web-only pubspec.yaml
        cat > pubspec_web.yaml << 'EOF'
        name: telemed_web
        description: "Web-only build of Telemed platform"
        publish_to: "none"
        
        version: 1.0.0+1
        
        environment:
          sdk: ">=3.8.0 <4.0.0"
        
        dependencies:
          flutter:
            sdk: flutter
          flutter_localizations:
            sdk: flutter
        
          # Core UI
          cupertino_icons: ^1.0.8
        
        flutter:
          uses-material-design: true
          generate: true
          assets:
            - assets/
        EOF
        
        # Use web-only pubspec temporarily
        cp pubspec_web.yaml pubspec.yaml
        
        # Get web-compatible dependencies
        flutter pub get
        
        # Build Flutter web app
        flutter build web \
          --dart-define=ENVIRONMENT=production \
          --dart-define=PLATFORM=web \
          --base-href /telemed18/ \
          --target lib/main_web.dart \
          --release
        
        # Restore original pubspec.yaml
        mv pubspec_backup.yaml pubspec.yaml
        
        # Copy additional static files if they exist
        if [ -f "simulator.html" ]; then
          cp simulator.html build/web/
        fi
        
        if [ -f "doctor_web_interface.html" ]; then
          cp doctor_web_interface.html build/web/
        fi
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './build/web'

  # Deploy job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4