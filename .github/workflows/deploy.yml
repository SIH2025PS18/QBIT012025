                .card:hover {
                    transform: translateY(-8px);
                    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
                    background: rgba(255, 255, 255, 0.15);
                }
                
                .card-icon {
                    font-size: 3rem;
                    margin-bottom: 1rem;
                    display: block;
                }
                
                .card h3 { 
                    font-size: 1.5rem; 
                    margin-bottom: 1rem; 
                    font-weight: 600;
                }
                
                .card p { 
                    opacity: 0.9; 
                    line-height: 1.6; 
                    margin-bottom: 1.5rem; 
                    font-size: 1rem;
                }
                
                .btn { 
                    padding: 1rem 2rem;
                    background: white;
                    color: #10B981;
                    border: none;
                    border-radius: 10px;
                    font-size: 1rem;
                    font-weight: 600;
                    text-decoration: none;
                    display: inline-block;
                    transition: all 0.3s ease;
                    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                }
                
                .btn:hover { 
                    transform: translateY(-2px);
                    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
                    background: #f8fafc;
                }
                
                .btn-secondary {
                    background: transparent;
                    color: white;
                    border: 2px solid rgba(255, 255, 255, 0.3);
                }
                
                .btn-secondary:hover {
                    background: rgba(255, 255, 255, 0.1);
                    color: white;
                }
                
                .features { margin: 4rem 0; }
                
                .features h2 {
                    text-align: center;
                    margin-bottom: 3rem;
                    font-size: 2.5rem;
                    font-weight: 700;
                }
                
                .feature-list {
                    list-style: none;
                    padding: 0;
                }
                
                .feature-list li {
                    padding: 0.75rem 0;
                    font-size: 1.1rem;
                }
                
                .feature-list li::before {
                    content: "✅ ";
                    margin-right: 0.75rem;
                    font-size: 1.2rem;
                }
                
                .footer {
                    text-align: center;
                    margin-top: 5rem;
                    padding-top: 3rem;
                    border-top: 1px solid rgba(255, 255, 255, 0.2);
                    opacity: 0.8;
                }
                
                .demo-section {
                    background: rgba(255, 255, 255, 0.05);
                    border-radius: 20px;
                    padding: 3rem;
                    margin: 3rem 0;
                    text-align: center;
                    backdrop-filter: blur(10px);
                    border: 1px solid rgba(255, 255, 255, 0.1);
                }
                
                @keyframes fadeInUp {
                    from {
                        opacity: 0;
                        transform: translateY(30px);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }
                }
                
                .grid .card:nth-child(1) { animation-delay: 0.1s; }
                .grid .card:nth-child(2) { animation-delay: 0.2s; }
                .grid .card:nth-child(3) { animation-delay: 0.3s; }
                
                @media (max-width: 768px) {
                    h1 { font-size: 2.5rem; }
                    .container { padding: 1rem; }
                    .grid { grid-template-columns: 1fr; gap: 1.5rem; }
                    .card { padding: 2rem; }
                }
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <div class="logo">🏥</div>
                    <h1>Telemed</h1>
                    <p class="subtitle">Comprehensive Rural Healthcare Platform</p>
                    <div class="status-badge">
                        <strong>🚀 Live Demo Available</strong> • SIH 2025 Problem Statement PS18
                    </div>
                </div>
                
                <div class="demo-section">
                    <h2 style="margin-bottom: 1rem;">🎯 Platform Demonstrations</h2>
                    <p style="margin-bottom: 2rem; font-size: 1.1rem;">Experience different aspects of our telemedicine solution</p>
                    
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <a href="./simulator.html" class="btn">📱 Patient Mobile App</a>
                        <a href="./doctor_web_interface.html" class="btn btn-secondary">👨‍⚕️ Doctor Interface</a>
                        <a href="https://github.com/SIH2025PS18/telemed18" class="btn btn-secondary" target="_blank">💻 Source Code</a>
                    </div>
                </div>
                
                <div class="grid">
                    <div class="card">
                        <span class="card-icon">🎥</span>
                        <h3>Video Consultations</h3>
                        <ul class="feature-list">
                            <li>HD video calls with Agora SDK</li>
                            <li>Screen sharing capabilities</li>
                            <li>Multi-language support (Hindi, Punjabi, English)</li>
                            <li>Recording for follow-ups</li>
                            <li>Real-time chat during consultations</li>
                        </ul>
                    </div>
                    
                    <div class="card">
                        <span class="card-icon">📋</span>
                        <h3>Health Management</h3>
                        <ul class="feature-list">
                            <li>Digital health records</li>
                            <li>Smart prescription management</li>
                            <li>Appointment scheduling & queue management</li>
                            <li>AI-powered symptom checker</li>
                            <li>Medication reminders</li>
                        </ul>
                    </div>
                    
                    <div class="card">
                        <span class="card-icon">🌐</span>
                        <h3>Offline-First Architecture</h3>
                        <ul class="feature-list">
                            <li>Works without internet connectivity</li>
                            <li>Automatic sync when online</li>
                            <li>Local SQLite database storage</li>
                            <li>Progressive Web App (PWA)</li>
                            <li>Cross-platform compatibility</li>
                        </ul>
                    </div>
                    
                    <div class="card">
                        <span class="card-icon">🏥</span>
                        <h3>Hospital Integration</h3>
                        <ul class="feature-list">
                            <li>Admin panel for hospital management</li>
                            <li>Doctor dashboard with patient queues</li>
                            <li>Pharmacy integration</li>
                            <li>Real-time notifications</li>
                            <li>Analytics and reporting</li>
                        </ul>
                    </div>
                    
                    <div class="card">
                        <span class="card-icon">🤖</span>
                        <h3>AI & ML Features</h3>
                        <ul class="feature-list">
                            <li>Multilingual NLP for symptom analysis</li>
                            <li>Predictive health analytics</li>
                            <li>Intelligent appointment scheduling</li>
                            <li>Drug interaction checking</li>
                            <li>Health risk assessment</li>
                        </ul>
                    </div>
                    
                    <div class="card">
                        <span class="card-icon">🔒</span>
                        <h3>Security & Privacy</h3>
                        <ul class="feature-list">
                            <li>End-to-end encryption</li>
                            <li>HIPAA compliant data handling</li>
                            <li>Secure authentication system</li>
