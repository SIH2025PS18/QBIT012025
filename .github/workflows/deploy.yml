                <div class="footer">
                    <h3 style="margin-bottom: 1rem;">🏥 Bridging Healthcare Gaps in Rural India</h3>
                    <p style="margin-bottom: 2rem;">Developed for Smart India Hackathon 2025 - Problem Statement PS18</p>
                    <div style="margin-bottom: 2rem;">
                        <a href="https://github.com/SIH2025PS18/telemed18" class="btn btn-secondary" target="_blank">View Full Documentation</a>
                    </div>
                    <p style="font-size: 0.9rem; opacity: 0.7;">
                        Built with Flutter • Node.js • MongoDB • Agora RTC • Socket.io
                    </p>
