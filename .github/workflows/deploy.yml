        </body>
        </html>
        EOF
        
        # Copy additional static files if they exist
        if [ -f "simulator.html" ]; then
          cp simulator.html build/web/
        fi
        
        if [ -f "doctor_web_interface.html" ]; then
          cp doctor_web_interface.html build/web/
        fi
        
        # Create a comprehensive README for the deployment
        cat > build/web/README.md << 'EOF'
        # Telemed - Rural Healthcare Platform
        
        ## 🏥 Overview
        Comprehensive telemedicine solution designed for rural healthcare delivery in India.
        
        ## 🚀 Features
        - Video consultations with HD quality
        - Offline-first mobile application
        - Multi-language support (Hindi, Punjabi, English)
        - AI-powered symptom checking
        - Real-time queue management
        - Progressive Web App capabilities
        
        ## 🛠️ Technology Stack
        - **Frontend**: Flutter (Mobile & Web)
        - **Backend**: Node.js with Express
        - **Database**: MongoDB with offline SQLite
        - **Video**: Agora RTC SDK
        - **Real-time**: Socket.io
        
        ## 📱 Demo Links
        - [Patient Mobile Simulator](./simulator.html)
        - [Doctor Web Interface](./doctor_web_interface.html)
        - [Source Code](https://github.com/SIH2025PS18/telemed18)
        
        ## 🏆 Smart India Hackathon 2025
        Problem Statement PS18: Rural Healthcare Platform
        
        ---
        **Note**: This deployment showcases the web interfaces. The full Flutter mobile app requires platform-specific builds.
        EOF
        
        # Create a sitemap
        cat > build/web/sitemap.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          <url>
            <loc>https://sih2025ps18.github.io/telemed18/</loc>
            <lastmod>2025-11-18</lastmod>
            <priority>1.0</priority>
          </url>
          <url>
            <loc>https://sih2025ps18.github.io/telemed18/simulator.html</loc>
            <lastmod>2025-11-18</lastmod>
            <priority>0.8</priority>
          </url>
          <url>
            <loc>https://sih2025ps18.github.io/telemed18/doctor_web_interface.html</loc>
            <lastmod>2025-11-18</lastmod>
            <priority>0.8</priority>
          </url>
        </urlset>
        EOF
        
        # Ensure proper file structure
        ls -la build/web/
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './build/web'

  # Deploy job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4