# Deploy Telemed Flutter Web App to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Set permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'
        cache: true
        
    - name: Enable web platform
      run: flutter config --enable-web
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Analyze code
      run: flutter analyze || true  # Continue even if analysis finds issues
      
    - name: Create web build directory
      run: mkdir -p build/web
      
    - name: Create comprehensive demo site
      run: |
        # Create main index page
        cat > build/web/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Telemed - Rural Healthcare Platform</title>
            <meta name="description" content="Telemed - Comprehensive rural healthcare platform with video consultations, appointment booking, and offline-first design.">
            <meta name="keywords" content="telemedicine, rural healthcare, video consultation, flutter, web app">
            <meta name="author" content="SIH2025 Team PS18">
            <meta name="theme-color" content="#10B981">
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body { 
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                    background: linear-gradient(135deg, #10B981 0%, #059669 100%);
                    color: white;
                    min-height: 100vh;
                    overflow-x: hidden;
                }
                
                .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
                
                .header { 
                    text-align: center; 
                    margin-bottom: 4rem;
                    animation: fadeInUp 1s ease-out;
                }
                
                .logo { 
                    width: 120px; 
                    height: 120px; 
                    background: rgba(255, 255, 255, 0.15);
                    border-radius: 24px;
                    margin: 0 auto 2rem;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 60px;
                    backdrop-filter: blur(10px);
                    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                }
                
                h1 { 
                    font-size: 4rem; 
                    font-weight: 800; 
                    margin-bottom: 1rem;
                    background: linear-gradient(45deg, #ffffff, #f0fdf4);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    background-clip: text;
                }
                
                .subtitle { 
                    font-size: 1.4rem; 
                    opacity: 0.9; 
                    margin-bottom: 2rem;
                }
                
                .status-badge {
                    display: inline-block;
                    background: rgba(255, 255, 255, 0.1);
                    padding: 0.75rem 1.5rem;
                    border-radius: 50px;
                    margin: 1rem 0;
                    backdrop-filter: blur(10px);
                    border: 1px solid rgba(255, 255, 255, 0.2);
                }
                
                .grid { 
                    display: grid; 
                    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
                    gap: 2rem; 
                    margin: 3rem 0;
                }
                
                .card { 
                    background: rgba(255, 255, 255, 0.1);
                    padding: 2.5rem;
                    border-radius: 16px;
                    backdrop-filter: blur(10px);
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    transition: all 0.3s ease;
