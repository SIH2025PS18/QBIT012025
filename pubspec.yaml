name: telemed_web
description: "Web-only build of Telemed platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  # Web-compatible only
  shared_preferences: ^2.2.3
  http: ^1.5.0
  url_launcher: ^6.2.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/