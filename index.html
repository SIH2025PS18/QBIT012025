<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/QBIT012025/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Telemed - Rural Healthcare Telemedicine Platform with AI Symptom Checker, Video Consultations, and Smart Pharmacy">
  <meta name="keywords" content="telemedicine, healthcare, rural health, video consultation, symptom checker, pharmacy, multilingual">
  <meta name="author" content="Telemed Team">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Telemed - Rural Healthcare Platform">
  <meta property="og:description" content="Comprehensive telemedicine platform with AI symptom analysis, video consultations, and smart pharmacy features">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sih2025ps18.github.io/QBIT012025/">
  <meta property="og:image" content="https://sih2025ps18.github.io/QBIT012025/icons/Icon-512.png">
  
  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Telemed - Rural Healthcare Platform">
  <meta name="twitter:description" content="Comprehensive telemedicine platform for rural communities">
  <meta name="twitter:image" content="https://sih2025ps18.github.io/QBIT012025/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="telemed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Telemed - Rural Healthcare Platform</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Preload critical resources -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
</head>
<body>
  <!-- Loading screen while Flutter initializes -->
  <div id="loading" style="position: fixed; inset: 0; background: #F8F9FA; display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="text-align: center; color: #1E293B;">
      <div style="width: 60px; height: 60px; border: 4px solid #E5E7EB; border-top: 4px solid #10B981; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
      <h2 style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600;">Telemed</h2>
      <p style="margin: 8px 0 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; opacity: 0.7;">Loading your healthcare platform...</p>
    </div>
  </div>
  
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => loading.remove(), 500);
      }
    });
    
    // Fallback: Hide loading screen after 10 seconds
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => loading.remove(), 500);
      }
    }, 10000);
  </script>
</body>
</html>
